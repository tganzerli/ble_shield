name: ble_shield
description: >-
  Defensive BLE central for Flutter (Android, iOS, macOS, Web): cached state,
  aggregated scan, serialized GATT, connect timeouts, managed auto-reconnect,
  typed errors.
version: 0.4.0
homepage: https://github.com/tganzerli/ble_shield
repository: https://github.com/tganzerli/ble_shield
issue_tracker: https://github.com/tganzerli/ble_shield/issues
topics: [bluetooth, ble, bluetooth-low-energy, flutter-plugin]

environment:
  sdk: ^3.3.0
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  # The app's generated web plugin registrant imports it. SDK package: no
  # hosted dependency enters the lock.
  flutter_web_plugins:
    sdk: flutter
  meta: ^1.16.0
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  fake_async: ^1.3.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  pigeon: 29.0.12

flutter:
  config:
    # Same as example/pubspec.yaml: a `flutter pub get` here also regenerates
    # the example's platform files, and without it the iOS and macOS runners
    # get a CocoaPods Podfile. Apps that depend on ble_shield do not read this.
    enable-swift-package-manager: true
  plugin:
    platforms:
      android:
        package: io.github.tganzerli.ble_shield
        pluginClass: BleShieldPlugin
      ios:
        pluginClass: BleShieldPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: BleShieldPlugin
        sharedDarwinSource: true
      web:
        pluginClass: BleShieldWeb
        fileName: src/web/ble_shield_web_plugin.dart
