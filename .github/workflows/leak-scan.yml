name: leak-scan

# Guards the boundary of this repository.
#
# ble_shield is developed in a private repository, next to material that must
# never appear here: internal document paths, the private repository name and
# internal work identifiers. A leak that reaches a published package version
# cannot be withdrawn, only superseded, so this is a gate, not a review.
#
# This workflow excludes itself from the scan, since it necessarily spells out
# the very terms it looks for. Each step captures the scanner's exit status
# (`|| rc=$?`, as steps run under `bash -e`): 0 is a hit, 1 is clean, anything
# else is a failure, never a pass.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: commit messages are scanned too

      - name: Scan tracked files
        run: |
          set -uo pipefail
          PATTERN='_wiki|ble_shield_main|claude|anthropic'
          rc=0; git grep -nIiE "$PATTERN" -- . ':!.github/workflows/leak-scan.yml' || rc=$?
          if [ "$rc" -eq 0 ]; then echo "::error::forbidden reference found in a tracked file"; exit 1; fi
          if [ "$rc" -gt 1 ]; then echo "::error::git grep failed (exit $rc)"; exit 1; fi
          echo "tracked files clean"

      - name: Scan internal identifiers
        run: |
          set -uo pipefail
          # Internal work identifiers (YYYY-MM-DD_slug), board cards (k12) and
          # requirement numbers (R3) mean nothing outside the private
          # repository. Generated Pigeon code is not written by hand, and Xcode
          # storyboard ids are random.
          PATTERN='[0-9]{4}-[0-9]{2}-[0-9]{2}_[a-z0-9-]+|(^|[^[:alnum:]_])(k[0-9]{1,3}|R[0-9]{1,2})([^[:alnum:]_]|$)'
          rc=0
          git grep -nIE "$PATTERN" -- . ':!.github/workflows/leak-scan.yml' \
              ':!*.g.dart' ':!*.g.kt' ':!*.g.swift' ':!*.storyboard' || rc=$?
          if [ "$rc" -eq 0 ]; then echo "::error::internal identifier found in a tracked file"; exit 1; fi
          if [ "$rc" -gt 1 ]; then echo "::error::git grep failed (exit $rc)"; exit 1; fi
          echo "no internal identifiers"

      - name: Scan commit history
        run: |
          set -uo pipefail
          PATTERN='_wiki|ble_shield_main|claude|anthropic|[0-9]{4}-[0-9]{2}-[0-9]{2}_[a-z0-9-]+|(^|[^[:alnum:]_])(k[0-9]{1,3}|R[0-9]{1,2})([^[:alnum:]_]|$)'
          log=$(git log --format='%s%n%b%n%an%n%ae') || { echo "::error::git log failed"; exit 1; }
          rc=0
          printf '%s\n' "$log" | grep -nIiE "$PATTERN" || rc=$?
          if [ "$rc" -eq 0 ]; then echo "::error::forbidden reference found in commit history"; exit 1; fi
          if [ "$rc" -gt 1 ]; then echo "::error::grep failed (exit $rc)"; exit 1; fi
          echo "history clean"

      - name: Scan for absolute local paths
        run: |
          set -uo pipefail
          rc=0; git grep -nIE '/(Users|home)/[a-z]' -- . ':!.github/workflows/leak-scan.yml' || rc=$?
          if [ "$rc" -eq 0 ]; then echo "::error::absolute local path found; use a relative path"; exit 1; fi
          if [ "$rc" -gt 1 ]; then echo "::error::git grep failed (exit $rc)"; exit 1; fi
          echo "no absolute local paths"
